name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use-case or workflow that is currently missing or difficult.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to see added or changed.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you currently use?

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - SQL / Query
        - Import / Export
        - Spatial Analysis (pgRouting, Topology, Chainage)
        - Database Design (Tables, Schemas, Functions)
        - Raster
        - Dashboard / Monitoring
        - QGIS Integration
        - UI / UX
        - Performance
        - Other
