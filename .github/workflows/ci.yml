name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check postgis_manager/ standalone/ --select E,F,W --ignore E501

  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python files
        run: |
          python -m compileall postgis_manager/ standalone/ qgis_plugin/ -q

  tests:
    name: Pytest (headless PyQt6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 libdbus-1-3 \
                                   libegl1 libxkbcommon0 libxcb-cursor0
      - name: Install Python dependencies
        run: pip install PyQt6 psycopg2-binary pytest pytest-qt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v --tb=short

  import-test:
    name: Import test (headless PyQt6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 libdbus-1-3 \
                                   libegl1 libxkbcommon0 libxcb-cursor0
          pip install PyQt6 psycopg2-binary
      - name: Test core imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')

          # DB layer
          from postgis_manager.db.connection import DBManager
          print('✔ DBManager')

          # Utils
          from postgis_manager.utils import i18n, config, theme
          i18n.load('en')
          print('✔ i18n (en)')
          i18n.load('ka')
          print('✔ i18n (ka)')

          # Check all i18n keys have Georgian translations
          en_keys = set(i18n._strings.keys())
          i18n.load('ka')
          ka_keys = set(i18n._strings.keys())
          missing = en_keys - ka_keys
          if missing:
              print(f'WARNING: {len(missing)} keys missing in ka.json: {list(missing)[:5]}')
          else:
              print('✔ All i18n keys present in ka.json')
          print('All imports OK')
          "

  plugin-zip:
    name: Build plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build zip
        run: python make_plugin_zip.py
      - name: Verify zip structure
        run: |
          python -c "
          import zipfile
          with zipfile.ZipFile('postgis_manager_plugin.zip') as zf:
              names = zf.namelist()
              roots = {n.split('/')[0] for n in names}
              assert roots == {'postgis_manager'}, f'Bad root: {roots}'
              assert any('metadata.txt' in n for n in names), 'Missing metadata.txt'
              assert any('__init__.py' in n for n in names), 'Missing __init__.py'
              print(f'✔ Plugin zip valid — {len(names)} files, root: postgis_manager/')
          "
      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: postgis_manager_plugin
          path: postgis_manager_plugin.zip
          retention-days: 30
